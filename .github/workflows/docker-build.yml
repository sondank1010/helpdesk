name: docker-build.yml
on:
  push:
    branches: [ "main", "master" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # 1. Lấy mã nguồn về máy mây GitHub
      - name: Checkout code
        uses: actions/checkout@v3
      # 2. Cài đặt Java 8 trên mây GitHub
      - name: Set up JDK 8
        uses: actions/setup-java@v3
        with:
          java-version: '8'
          distribution: 'temurin'
          cache: maven
      # 3. Build file JAR bằng Maven
      - name: Build JAR with Maven
        run: |
          chmod +x mvnw
          ./mvnw clean package -DskipTests
      # 4. Đăng nhập vào Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # 5. Build Docker Image và Push lên Docker Hub
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/helpdesk-app:latest


